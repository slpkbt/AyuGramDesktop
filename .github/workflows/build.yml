name: Build SleepyGram

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - sync-telegram-6.8.2-sleepygram-actions
      - dev

jobs:
  windows-x64:
    name: windows-x64
    runs-on: windows-2022
    env:
      TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID || secrets.AYUGRAM_API_ID || secrets.TELEGRAM_API_ID || secrets.API_ID || '2040' }}
      TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH || secrets.AYUGRAM_API_HASH || secrets.TELEGRAM_API_HASH || secrets.API_HASH || 'b18441a1ff607e10a989891a5462e627' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check required secrets
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TDESKTOP_API_ID) -or [string]::IsNullOrWhiteSpace($env:TDESKTOP_API_HASH)) {
            Write-Error "Missing API credentials. Add TDESKTOP_API_ID/TDESKTOP_API_HASH or reuse AyuGram credentials as AYUGRAM_API_ID/AYUGRAM_API_HASH, TELEGRAM_API_ID/TELEGRAM_API_HASH, or API_ID/API_HASH."
            exit 1
          }

      - name: Prepare directories
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE\TBuild\Libraries" | Out-Null
          cmd /c mklink /d "$env:GITHUB_WORKSPACE\TBuild" "$env:USERPROFILE\TBuild"
          "TBUILD=$env:GITHUB_WORKSPACE\TBuild" >> $env:GITHUB_ENV
          "REPO_PATH=$env:GITHUB_WORKSPACE\TBuild\tdesktop" >> $env:GITHUB_ENV
          "LIBRARIES_PATH=$env:GITHUB_WORKSPACE\TBuild\Libraries\win64" >> $env:GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: TBuild/tdesktop

      - name: Read Windows SDK
        run: |
          $doc = Get-Content "$env:REPO_PATH\docs\building-win-x64.md" -Raw
          if ($doc -notmatch 'with \*\*(?<sdk>[^*]+)\*\* SDK version') {
            Write-Error "Could not read Windows SDK version from docs/building-win-x64.md"
            exit 1
          }
          "SDK=$($Matches.sdk)" >> $env:GITHUB_ENV

      - name: Cache ThirdParty
        uses: actions/cache@v4
        with:
          path: TBuild\ThirdParty
          key: windows-x64-third-party-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/prepare.py') }}
          restore-keys: windows-x64-third-party-

      - name: Cache libraries
        uses: actions/cache@v4
        with:
          path: TBuild\Libraries\win64
          key: windows-x64-libraries-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/prepare.py') }}
          restore-keys: windows-x64-libraries-

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: ${{ env.SDK }}

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json
          exit 0

      - name: Prepare libraries
        shell: cmd
        env:
          GYP_MSVS_OVERRIDE_PATH: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\
          GYP_MSVS_VERSION: 2022
        run: |
          "%REPO_PATH%\Telegram\build\prepare\win.bat" silent

      - name: Configure
        shell: cmd
        run: |
          cd "%REPO_PATH%\Telegram"
          call configure.bat ^
            x64 ^
            -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
            -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% ^
            -D CMAKE_CONFIGURATION_TYPES=Release ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
            -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=

      - name: Build
        shell: cmd
        run: cmake --build "%REPO_PATH%\out" --config Release --parallel

      - name: Package
        run: |
          $out = "$env:REPO_PATH\out\Release"
          if (!(Test-Path "$out\SleepyGram.exe") -or !(Test-Path "$out\Updater.exe")) {
            Write-Error "Smoke check failed: SleepyGram.exe or Updater.exe not found"
            exit 1
          }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\sleepygram-windows-x64" | Out-Null
          Copy-Item "$out\SleepyGram.exe" "$env:RUNNER_TEMP\sleepygram-windows-x64\"
          Copy-Item "$out\Updater.exe" "$env:RUNNER_TEMP\sleepygram-windows-x64\"
          Compress-Archive -Path "$env:RUNNER_TEMP\sleepygram-windows-x64\*" -DestinationPath "$env:RUNNER_TEMP\SleepyGram-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SleepyGram-windows-x64.zip
          path: ${{ runner.temp }}\SleepyGram-windows-x64.zip
          if-no-files-found: error

  linux-x64:
    name: linux-x64
    runs-on: ubuntu-22.04
    env:
      TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID || secrets.AYUGRAM_API_ID || secrets.TELEGRAM_API_ID || secrets.API_ID || '2040' }}
      TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH || secrets.AYUGRAM_API_HASH || secrets.TELEGRAM_API_HASH || secrets.API_HASH || 'b18441a1ff607e10a989891a5462e627' }}
      IMAGE_TAG: sleepygram:centos_env
    steps:
      - name: Check required secrets
        run: |
          if [ -z "$TDESKTOP_API_ID" ] || [ -z "$TDESKTOP_API_HASH" ]; then
            echo "::error::Missing API credentials. Add TDESKTOP_API_ID/TDESKTOP_API_HASH or reuse AyuGram credentials as AYUGRAM_API_ID/AYUGRAM_API_HASH, TELEGRAM_API_ID/TELEGRAM_API_HASH, or API_ID/API_HASH."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare Dockerfile
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE="$(DEBUG= LTO= poetry run gen_dockerfile)"
          printf '%s\n' "$DOCKERFILE" > Dockerfile

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: linux-x64-buildx-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: linux-x64-buildx-

      - name: Prepare libraries
        uses: docker/build-push-action@v6
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move Docker cache
        run: |
          rm -rf "${{ runner.temp }}/.buildx-cache"
          mv "${{ runner.temp }}/.buildx-cache-new" "${{ runner.temp }}/.buildx-cache"

      - name: Build
        run: |
          docker run --rm \
            -u "$(id -u)" \
            -v "$PWD:/usr/src/tdesktop" \
            -e CONFIG=Release \
            "$IMAGE_TAG" \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
              -D CMAKE_CONFIGURATION_TYPES=Release \
              -D TDESKTOP_API_ID="$TDESKTOP_API_ID" \
              -D TDESKTOP_API_HASH="$TDESKTOP_API_HASH" \
              -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
              -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Package
        run: |
          test -f out/Release/SleepyGram || { echo "::error::Smoke check failed: SleepyGram not found"; exit 1; }
          test -f out/Release/Updater || { echo "::error::Smoke check failed: Updater not found"; exit 1; }
          mkdir -p "$RUNNER_TEMP/sleepygram-linux-x64"
          cp out/Release/SleepyGram out/Release/Updater "$RUNNER_TEMP/sleepygram-linux-x64/"
          tar -C "$RUNNER_TEMP/sleepygram-linux-x64" -cJf "$RUNNER_TEMP/SleepyGram-linux-x64.tar.xz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SleepyGram-linux-x64.tar.xz
          path: ${{ runner.temp }}/SleepyGram-linux-x64.tar.xz
          if-no-files-found: error

  macos-x64:
    name: macos-x64
    runs-on: macos-13
    env:
      TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID || secrets.AYUGRAM_API_ID || secrets.TELEGRAM_API_ID || secrets.API_ID || '2040' }}
      TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH || secrets.AYUGRAM_API_HASH || secrets.TELEGRAM_API_HASH || secrets.API_HASH || 'b18441a1ff607e10a989891a5462e627' }}
    steps:
      - name: Check required secrets
        run: |
          if [ -z "$TDESKTOP_API_ID" ] || [ -z "$TDESKTOP_API_HASH" ]; then
            echo "::error::Missing API credentials. Add TDESKTOP_API_ID/TDESKTOP_API_HASH or reuse AyuGram credentials as AYUGRAM_API_ID/AYUGRAM_API_HASH, TELEGRAM_API_ID/TELEGRAM_API_HASH, or API_ID/API_HASH."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: tdesktop

      - name: Install tools
        run: |
          brew update
          brew install automake meson nasm ninja pkg-config
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache libraries
        uses: actions/cache@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: macos-x64-libraries-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py') }}
          restore-keys: macos-x64-libraries-

      - name: Prepare libraries
        run: ./tdesktop/Telegram/build/prepare/mac.sh silent

      - name: Build
        run: |
          cd tdesktop/Telegram
          ./configure.sh \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D CMAKE_OSX_ARCHITECTURES=x86_64 \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D TDESKTOP_API_ID="$TDESKTOP_API_ID" \
            -D TDESKTOP_API_HASH="$TDESKTOP_API_HASH" \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          cmake --build ../out --config Release --parallel

      - name: Package
        run: |
          cd tdesktop/out/Release
          test -d SleepyGram.app || { echo "::error::Smoke check failed: SleepyGram.app not found"; exit 1; }
          codesign --force --deep --sign - SleepyGram.app
          codesign --verify --deep --strict SleepyGram.app
          ditto -c -k --sequesterRsrc --keepParent SleepyGram.app "$RUNNER_TEMP/SleepyGram-macos-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SleepyGram-macos-x64.zip
          path: ${{ runner.temp }}/SleepyGram-macos-x64.zip
          if-no-files-found: error
